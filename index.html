<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>🔥 Gesture Fireball</title>
  <meta name="description" content="Control a fireball with hand gestures — open hand to hold, pinch to resize, fast fist snap to throw!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }

    /* ── Loading screen ───────────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, #1c0800 0%, #000 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 200;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .fire-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff4500 0%, #ff8c00 45%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.7; } }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,120,0,.15);
      border-top-color: #ff6b00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-msg {
      color: rgba(255,255,255,.45);
      font-size: .875rem;
      letter-spacing: .04em;
    }

    /* ── Canvas ───────────────────────────────────────────────────────── */
    #video   { display: none; }
    #fxLayer { display: none; }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── HUD ──────────────────────────────────────────────────────────── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 18px; left: 18px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,100,0,.35);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #ff7b00;
      transition: color .25s, border-color .25s;
    }
    #status.holding { color: #ffe566; border-color: rgba(255,229,102,.55); }
    #status.thrown  { color: #fff;    border-color: rgba(255,255,255,.55); }
    #status.snuffed { color: #aaa;    border-color: rgba(180,180,180,.4);  }

    #particle-count {
      position: absolute;
      top: 18px; right: 18px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
      font-variant-numeric: tabular-nums;
    }

    #instructions {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,100,0,.2);
      border-radius: 14px;
      padding: 10px 22px;
      font-size: 12px;
      color: rgba(255,255,255,.5);
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      #instructions {
        white-space: normal;
        font-size: 11px;
        width: 90%;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="fire-title">🔥 Gesture Fireball</div>
  <div class="spinner"></div>
  <div id="loading-msg">Loading hand-tracking model…</div>
</div>

<!-- Hidden video + offscreen fx canvas -->
<video id="video" autoplay playsinline muted></video>
<canvas id="fxLayer"></canvas>

<!-- Main visible canvas -->
<canvas id="main-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="status">👁 No Hand</div>
  <div id="particle-count">0 particles</div>
  <div id="instructions">
    ✋ Open hand → fireball on palm &nbsp;|&nbsp;
    🤏 Pinch → resize &nbsp;|&nbsp;
    ☝️ One finger → candle &nbsp;|&nbsp;
    👊 Fast fist snap → THROW &nbsp;|&nbsp;
    Slow fist → snuff
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── Constants ────────────────────────────────────────────────────────────────
const THUMB_TIP   = 4;
const INDEX_TIP   = 8;
const FINGER_TIPS = [8, 12, 16, 20];
const FINGER_PIPS = [6, 10, 14, 18];
// Palm center landmarks: wrist + 4 MCP knuckles
const PALM_IDS    = [0, 5, 9, 13, 17];

const MIN_RADIUS = 15, MAX_RADIUS = 80;
const THROW_SPEED_THRESHOLD = 550;
const THROW_MULT   = 1.15;
const GRAVITY      = 950;
const PARTICLE_CAP = 450;
const EMIT_RATE    = 3;

// ── Fireball colour gradient ──────────────────────────────────────────────────
const STOPS = [
  [1.00, [255, 255, 255]],
  [0.80, [255, 255, 180]],
  [0.55, [255, 200,   0]],
  [0.30, [255,  90,   0]],
  [0.10, [160,  20,   0]],
  [0.00, [ 10,  10,  10]],
];

function makeColorFn(stops) {
  return function(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < stops.length - 1; i++) {
      const [t0, c0] = stops[i];
      const [t1, c1] = stops[i + 1];
      if (t >= t1 && t <= t0) {
        const f = (t - t1) / (t0 - t1 + 1e-6);
        return c1.map((v, k) => v + (c0[k] - v) * f);
      }
    }
    return stops.at(-1)[1].slice();
  };
}

const flameColor  = makeColorFn(STOPS);

// ── Candle colour gradient (blue base → gold → ivory tip) ────────────────────
const CANDLE_STOPS = [
  [1.00, [255, 255, 220]],   // ivory white tip
  [0.70, [255, 210,  60]],   // golden yellow
  [0.40, [255, 130,  10]],   // warm orange
  [0.18, [ 80,  60, 240]],   // blue inner cone
  [0.00, [ 15,   8,  80]],   // deep violet base
];
const candleColor = makeColorFn(CANDLE_STOPS);

function rgbaStr([r, g, b], a) {
  return `rgba(${r | 0},${g | 0},${b | 0},${a.toFixed(3)})`;
}

// ── Additive radial splat ────────────────────────────────────────────────────
function splat(ctx, x, y, radius, color, alpha) {
  if (radius <= 0 || alpha <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, rgbaStr(color, alpha));
  g.addColorStop(1, rgbaStr(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// ── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, life, r0, colorFn = flameColor) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = this.maxLife = life;
    this.r0 = r0;
    this.colorFn = colorFn;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(dt, t) {
    this.vy -= 45 * dt;
    this.vx += Math.sin(t * 4 + this.phase) * 35 * dt;
    this.vx *= 0.98;
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.life -= dt;
    return this.life > 0;
  }
  draw(ctx) {
    const t      = Math.max(0, this.life / this.maxLife);
    const radius = this.r0 * (0.3 + 0.7 * t);
    const alpha  = Math.pow(t, 0.6);
    splat(ctx, this.x, this.y, radius, this.colorFn(t), alpha);
  }
}

// ── Projectile ───────────────────────────────────────────────────────────────
class Projectile {
  constructor(x, y, vx, vy, r) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.r = r;
    this.life = 1.6;
    this.alive = true;
  }
  update(dt, W, H, particles, cap = PARTICLE_CAP) {
    this.cap = cap;
    this.vy += GRAVITY * dt;
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.life -= dt;
    for (let i = 0; i < 2; i++) {
      if (particles.length < this.cap) {
        particles.push(new Particle(
          this.x + (Math.random() - 0.5) * 8,
          this.y + (Math.random() - 0.5) * 8,
          -this.vx * 0.12 + (Math.random() - 0.5) * 80,
          -this.vy * 0.12 + (Math.random() - 0.5) * 80,
          0.2 + Math.random() * 0.3,
          this.r * 0.5,
        ));
      }
    }
    if (this.life <= 0 || this.x < -60 || this.x > W + 60 || this.y > H + 60)
      this.alive = false;
  }
  draw(ctx) {
    splat(ctx, this.x, this.y, this.r * 1.6, [255,  90,  0], 0.30);
    splat(ctx, this.x, this.y, this.r * 1.1, [255, 160,  0], 0.50);
    splat(ctx, this.x, this.y, this.r * 0.6, [255, 255, 200], 0.85);
  }
}

function spawnExplosion(particles, x, y, n = 40) {
  for (let i = 0; i < n; i++) {
    if (particles.length >= PARTICLE_CAP) break;
    const ang   = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 300;
    particles.push(new Particle(
      x, y,
      Math.cos(ang) * speed,
      Math.sin(ang) * speed - 60,
      0.3 + Math.random() * 0.4,
      6   + Math.random() * 8,
    ));
  }
}

function drawCore(ctx, x, y, r) {
  splat(ctx, x, y, r * 1.8, [140,  60,  0], 0.16);
  splat(ctx, x, y, r * 1.3, [200, 110,  0], 0.26);
  splat(ctx, x, y, r * 0.9, [255, 170,  0], 0.42);
  splat(ctx, x, y, r * 0.5, [255, 240, 180], 0.85);
}

function isFist(lm) {
  for (let i = 0; i < FINGER_TIPS.length; i++)
    if (lm[FINGER_TIPS[i]].y < lm[FINGER_PIPS[i]].y) return false;
  return true;
}

// Only index finger extended, rest curled → candle mode
function isOneFingerUp(lm) {
  if (lm[FINGER_TIPS[0]].y >= lm[FINGER_PIPS[0]].y) return false; // index must be up
  for (let i = 1; i < FINGER_TIPS.length; i++)
    if (lm[FINGER_TIPS[i]].y < lm[FINGER_PIPS[i]].y) return false; // others must be curled
  return true;
}

// Palm center: average of wrist + 4 MCP knuckles (normalized coords)
function palmCenter(lm) {
  const x = PALM_IDS.reduce((s, i) => s + lm[i].x, 0) / PALM_IDS.length;
  const y = PALM_IDS.reduce((s, i) => s + lm[i].y, 0) / PALM_IDS.length;
  return { x, y };
}

// Candle core: blue base → golden middle → ivory tip (teardrop shape)
function drawCandleCore(ctx, x, y, r) {
  splat(ctx, x,           y,           r * 0.35, [ 60,  40, 255], 0.70); // blue base
  splat(ctx, x,           y,           r * 0.20, [180, 160, 255], 0.90); // bright blue
  splat(ctx, x,           y - r * 0.5, r * 0.50, [255, 180,  20], 0.55); // golden middle
  splat(ctx, x,           y - r * 0.9, r * 0.35, [255, 240, 180], 0.75); // ivory tip
  splat(ctx, x,           y - r * 0.9, r * 0.18, [255, 255, 255], 0.95); // white hot point
}

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ── Main ─────────────────────────────────────────────────────────────────────
async function main() {
  const loadingEl  = document.getElementById('loading');
  const loadingMsg = document.getElementById('loading-msg');
  const statusEl   = document.getElementById('status');
  const pcountEl   = document.getElementById('particle-count');
  const video      = document.getElementById('video');
  const mainCanvas = document.getElementById('main-canvas');
  const fxCanvas   = document.getElementById('fxLayer');
  const mainCtx    = mainCanvas.getContext('2d');
  const fxCtx      = fxCanvas.getContext('2d');

  function resize() {
    mainCanvas.width  = fxCanvas.width  = window.innerWidth;
    mainCanvas.height = fxCanvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Load MediaPipe
  loadingMsg.textContent = 'Downloading vision model (~8 MB, first load only)…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/" +
        "hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6,
  });

  // Camera
  loadingMsg.textContent = 'Requesting camera access…';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    });
  } catch {
    loadingMsg.textContent = '❌ Camera access denied — please allow camera and reload.';
    return;
  }
  video.srcObject = stream;
  await new Promise(r => { video.onloadedmetadata = r; });
  await video.play();

  loadingEl.classList.add('hidden');
  setTimeout(() => loadingEl.remove(), 700);

  // Tune particle cap for mobile (keep 60fps)
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const particleCap = isMobile ? 220 : PARTICLE_CAP;

  // State
  let particles   = [];
  let projectiles = [];
  let smoothX = null, smoothY = null, smoothR = 0;
  let prevSX  = null, prevSY  = null;
  let velX = 0, velY = 0;
  let holding     = false;
  let candleOn    = false;   // candle mode active
  let candleX = 0, candleY = 0;
  let lastTime    = performance.now();
  let lastVidTime = -1;

  // Render loop
  function loop(now) {
    requestAnimationFrame(loop);

    const dt = clamp((now - lastTime) / 1000, 0.001, 0.05);
    lastTime = now;
    const t  = now / 1000;
    const W  = mainCanvas.width;
    const H  = mainCanvas.height;

    // ── Cover-mode video geometry ──────────────────────────────────────────
    // Compute source-crop so the video fills the canvas without distortion
    // (same as CSS object-fit:cover).  Landmarks are then mapped through the
    // same crop so the fireball sits exactly over the detected hand.
    const vw = video.videoWidth  || W;
    const vh = video.videoHeight || H;
    const vidScale = Math.max(W / vw, H / vh);
    const srcW = W / vidScale;                   // source crop width  (px)
    const srcH = H / vidScale;                   // source crop height (px)
    const srcX = (vw - srcW) / 2;               // source crop x offset
    const srcY = (vh - srcH) / 2;               // source crop y offset

    // Convert normalised landmark coord → canvas pixel (cover + mirror)
    const lmToCanvasX = nx => W * (1 - (nx * vw - srcX) / srcW);
    const lmToCanvasY = ny => H *      (ny * vh - srcY) / srcH;

    let prevHolding = holding;
    let status = 'nohand';

    if (video.readyState >= 2 && video.currentTime !== lastVidTime) {
      lastVidTime = video.currentTime;
      const result = landmarker.detectForVideo(video, now);

      if (result.landmarks && result.landmarks.length > 0) {
        const lm   = result.landmarks[0];
        const fist = isFist(lm);
        const oneUp = isOneFingerUp(lm);

        if (oneUp) {
          // ── Candle mode: index fingertip ────────────────────────────────
          candleX  = lmToCanvasX(lm[INDEX_TIP].x);
          candleY  = lmToCanvasY(lm[INDEX_TIP].y);
          candleOn = true;
          holding  = false;
          prevSX   = prevSY = null;
          status   = 'candle';
        } else if (!fist) {
          // ── Fireball mode: palm center ──────────────────────────────────
          candleOn = false;
          const pc = palmCenter(lm);
          const cx = lmToCanvasX(pc.x);
          const cy = lmToCanvasY(pc.y);

          const pdNorm = Math.hypot(
            lm[THUMB_TIP].x - lm[INDEX_TIP].x,
            lm[THUMB_TIP].y - lm[INDEX_TIP].y
          );
          const base   = Math.min(W, H);
          const minR   = base * 0.05;
          const maxR   = base * 0.20;
          const tR = clamp(
            minR + (pdNorm - 0.03) / (0.25 - 0.03) * (maxR - minR),
            minR, maxR
          );

          // High lerp factor (0.8) = near-instant tracking, almost no lag
          smoothX = smoothX === null ? cx : lerp(smoothX, cx, 0.8);
          smoothY = smoothY === null ? cy : lerp(smoothY, cy, 0.8);
          smoothR = smoothR === 0    ? tR : lerp(smoothR, tR, 0.5);

          if (prevSX !== null) {
            velX = (smoothX - prevSX) / dt;
            velY = (smoothY - prevSY) / dt;
          }
          prevSX = smoothX; prevSY = smoothY;
          holding = true;
          status  = 'holding';
        } else {
          // ── Fist: throw or snuff ────────────────────────────────────────
          candleOn = false;
          holding  = false;
          if (prevHolding && prevSX !== null) {
            const speed = Math.hypot(velX, velY);
            if (speed > THROW_SPEED_THRESHOLD) {
              projectiles.push(new Projectile(smoothX, smoothY, velX * THROW_MULT, velY * THROW_MULT, smoothR));
              status = 'thrown';
            } else {
              status = 'snuffed';
            }
          } else {
            status = 'fist';
          }
          prevSX = prevSY = null;
        }
      } else {
        holding  = false;
        candleOn = false;
        prevSX   = prevSY = null;
      }
    }

    // Draw video in cover-mode (no distortion, centered crop)
    mainCtx.save();
    mainCtx.translate(W, 0);
    mainCtx.scale(-1, 1);
    mainCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, W, H);
    mainCtx.restore();

    // Clear FX canvas
    fxCtx.clearRect(0, 0, W, H);
    fxCtx.globalCompositeOperation = 'lighter';

    // Emit + draw core
    if (holding && smoothX !== null) {
      for (let i = 0; i < EMIT_RATE; i++) {
        if (particles.length < particleCap) {
          particles.push(new Particle(
            smoothX + (Math.random() - 0.5) * smoothR * 0.6,
            smoothY + (Math.random() - 0.5) * smoothR * 0.6,
            (Math.random() - 0.5) * 55,
            -110 + Math.random() * 70,
            0.35 + Math.random() * 0.35,
            smoothR * 0.55,
          ));
        }
      }
      drawCore(fxCtx, smoothX, smoothY, smoothR);
    }

    // Candle flame: small delicate particles at fingertip
    if (candleOn) {
      const cr = Math.min(W, H) * 0.04;  // candle flame radius
      for (let i = 0; i < 2; i++) {
        if (particles.length < particleCap) {
          particles.push(new Particle(
            candleX + (Math.random() - 0.5) * cr * 0.3,
            candleY + (Math.random() - 0.5) * cr * 0.2,
            (Math.random() - 0.5) * 12,        // gentle drift
            -55 + Math.random() * 20,           // rises upward
            0.25 + Math.random() * 0.25,
            cr * 0.4,
            candleColor,                        // blue-gold gradient
          ));
        }
      }
      drawCandleCore(fxCtx, candleX, candleY, cr);
    }

    // Particles
    particles = particles.filter(p => {
      const alive = p.update(dt, t);
      if (alive) p.draw(fxCtx);
      return alive;
    });

    // Projectiles
    const surviving = [];
    for (const proj of projectiles) {
      proj.update(dt, W, H, particles, particleCap);
      if (proj.alive) { proj.draw(fxCtx); surviving.push(proj); }
      else spawnExplosion(particles, proj.x, proj.y);
    }
    projectiles = surviving;

    // Composite: fire layer with screen blend
    mainCtx.globalCompositeOperation = 'screen';
    mainCtx.drawImage(fxCanvas, 0, 0);

    // Bloom pass
    mainCtx.save();
    mainCtx.globalCompositeOperation = 'screen';
    mainCtx.globalAlpha = 0.4;
    mainCtx.filter = 'blur(14px)';
    mainCtx.drawImage(fxCanvas, 0, 0);
    mainCtx.restore();

    mainCtx.filter = 'none';
    mainCtx.globalCompositeOperation = 'source-over';
    mainCtx.globalAlpha = 1;

    // HUD
    const map = {
      holding: ['🔥 Holding',  'holding'],
      thrown:  ['💥 Thrown!',  'thrown'],
      snuffed: ['💨 Snuffed',  'snuffed'],
      candle:  ['🕯 Candle',   'holding'],
      fist:    ['✊ Fist',     ''],
      nohand:  ['👁 No Hand',  ''],
    };
    const [label, cls] = map[status] ?? map.nohand;
    statusEl.textContent = label;
    statusEl.className   = cls;
    pcountEl.textContent = `${particles.length} particles`;
  }

  requestAnimationFrame(loop);
}

main().catch(err => {
  const msg = document.getElementById('loading-msg');
  if (msg) msg.textContent = '❌ ' + err.message;
  console.error(err);
});
</script>
</body>
</html>

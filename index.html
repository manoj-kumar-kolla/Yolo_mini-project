<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>🔥 Gesture Fireball</title>
  <meta name="description" content="Control a fireball with hand gestures — open hand to hold, pinch to resize, fast fist snap to throw!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
    }

    /* ── Loading screen ───────────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, #1c0800 0%, #000 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 200;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .fire-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff4500 0%, #ff8c00 45%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.7; } }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,120,0,.15);
      border-top-color: #ff6b00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-msg {
      color: rgba(255,255,255,.45);
      font-size: .875rem;
      letter-spacing: .04em;
    }

    /* ── Canvas ───────────────────────────────────────────────────────── */
    #video   { display: none; }
    #fxLayer { display: none; }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── HUD ──────────────────────────────────────────────────────────── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #status {
      position: absolute;
      top: 18px; left: 18px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,100,0,.35);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #ff7b00;
      transition: color .25s, border-color .25s;
    }
    #status.holding { color: #ffe566; border-color: rgba(255,229,102,.55); }
    #status.thrown  { color: #fff;    border-color: rgba(255,255,255,.55); }
    #status.snuffed { color: #aaa;    border-color: rgba(180,180,180,.4);  }

    #particle-count {
      position: absolute;
      top: 18px; right: 18px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
      font-variant-numeric: tabular-nums;
    }

    #instructions {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,100,0,.2);
      border-radius: 14px;
      padding: 10px 22px;
      font-size: 12px;
      color: rgba(255,255,255,.5);
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      #instructions {
        white-space: normal;
        font-size: 11px;
        width: 90%;
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="fire-title">🔥 Gesture Fireball</div>
  <div class="spinner"></div>
  <div id="loading-msg">Loading hand-tracking model…</div>
</div>

<!-- Hidden video + offscreen fx canvas -->
<video id="video" autoplay playsinline muted></video>
<canvas id="fxLayer"></canvas>

<!-- Main visible canvas -->
<canvas id="main-canvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="status">👁 No Hand</div>
  <div id="particle-count">0 particles</div>
  <div id="instructions">
    ✋ Open hand → hold fireball &nbsp;|&nbsp;
    🤏 Pinch → resize &nbsp;|&nbsp;
    👊 Fast fist snap → THROW &nbsp;|&nbsp;
    Slow fist → snuff out
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── Constants ────────────────────────────────────────────────────────────────
const THUMB_TIP   = 4;
const INDEX_TIP   = 8;
const FINGER_TIPS = [8, 12, 16, 20];
const FINGER_PIPS = [6, 10, 14, 18];

const MIN_RADIUS = 15, MAX_RADIUS = 80;
const THROW_SPEED_THRESHOLD = 550;
const THROW_MULT   = 1.15;
const GRAVITY      = 950;
const PARTICLE_CAP = 450;
const EMIT_RATE    = 3;

// ── Flame colour gradient ────────────────────────────────────────────────────
const STOPS = [
  [1.00, [255, 255, 255]],
  [0.80, [255, 255, 180]],
  [0.55, [255, 200,   0]],
  [0.30, [255,  90,   0]],
  [0.10, [160,  20,   0]],
  [0.00, [ 10,  10,  10]],
];

function flameColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < STOPS.length - 1; i++) {
    const [t0, c0] = STOPS[i];
    const [t1, c1] = STOPS[i + 1];
    if (t >= t1 && t <= t0) {
      const f = (t - t1) / (t0 - t1 + 1e-6);
      return c1.map((v, k) => v + (c0[k] - v) * f);
    }
  }
  return STOPS.at(-1)[1].slice();
}

function rgbaStr([r, g, b], a) {
  return `rgba(${r | 0},${g | 0},${b | 0},${a.toFixed(3)})`;
}

// ── Additive radial splat ────────────────────────────────────────────────────
function splat(ctx, x, y, radius, color, alpha) {
  if (radius <= 0 || alpha <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, rgbaStr(color, alpha));
  g.addColorStop(1, rgbaStr(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// ── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, life, r0) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = this.maxLife = life;
    this.r0 = r0;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(dt, t) {
    this.vy -= 45 * dt;
    this.vx += Math.sin(t * 4 + this.phase) * 35 * dt;
    this.vx *= 0.98;
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.life -= dt;
    return this.life > 0;
  }
  draw(ctx) {
    const t      = Math.max(0, this.life / this.maxLife);
    const radius = this.r0 * (0.3 + 0.7 * t);
    const alpha  = Math.pow(t, 0.6);
    splat(ctx, this.x, this.y, radius, flameColor(t), alpha);
  }
}

// ── Projectile ───────────────────────────────────────────────────────────────
class Projectile {
  constructor(x, y, vx, vy, r) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.r = r;
    this.life = 1.6;
    this.alive = true;
  }
  update(dt, W, H, particles, cap = PARTICLE_CAP) {
    this.cap = cap;
    this.vy += GRAVITY * dt;
    this.x  += this.vx * dt;
    this.y  += this.vy * dt;
    this.life -= dt;
    for (let i = 0; i < 2; i++) {
      if (particles.length < this.cap) {
        particles.push(new Particle(
          this.x + (Math.random() - 0.5) * 8,
          this.y + (Math.random() - 0.5) * 8,
          -this.vx * 0.12 + (Math.random() - 0.5) * 80,
          -this.vy * 0.12 + (Math.random() - 0.5) * 80,
          0.2 + Math.random() * 0.3,
          this.r * 0.5,
        ));
      }
    }
    if (this.life <= 0 || this.x < -60 || this.x > W + 60 || this.y > H + 60)
      this.alive = false;
  }
  draw(ctx) {
    splat(ctx, this.x, this.y, this.r * 1.6, [255,  90,  0], 0.30);
    splat(ctx, this.x, this.y, this.r * 1.1, [255, 160,  0], 0.50);
    splat(ctx, this.x, this.y, this.r * 0.6, [255, 255, 200], 0.85);
  }
}

function spawnExplosion(particles, x, y, n = 40) {
  for (let i = 0; i < n; i++) {
    if (particles.length >= PARTICLE_CAP) break;
    const ang   = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 300;
    particles.push(new Particle(
      x, y,
      Math.cos(ang) * speed,
      Math.sin(ang) * speed - 60,
      0.3 + Math.random() * 0.4,
      6   + Math.random() * 8,
    ));
  }
}

function drawCore(ctx, x, y, r) {
  splat(ctx, x, y, r * 1.8, [140,  60,  0], 0.16);
  splat(ctx, x, y, r * 1.3, [200, 110,  0], 0.26);
  splat(ctx, x, y, r * 0.9, [255, 170,  0], 0.42);
  splat(ctx, x, y, r * 0.5, [255, 240, 180], 0.85);
}

function isFist(lm) {
  for (let i = 0; i < FINGER_TIPS.length; i++)
    if (lm[FINGER_TIPS[i]].y < lm[FINGER_PIPS[i]].y) return false;
  return true;
}

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ── Main ─────────────────────────────────────────────────────────────────────
async function main() {
  const loadingEl  = document.getElementById('loading');
  const loadingMsg = document.getElementById('loading-msg');
  const statusEl   = document.getElementById('status');
  const pcountEl   = document.getElementById('particle-count');
  const video      = document.getElementById('video');
  const mainCanvas = document.getElementById('main-canvas');
  const fxCanvas   = document.getElementById('fxLayer');
  const mainCtx    = mainCanvas.getContext('2d');
  const fxCtx      = fxCanvas.getContext('2d');

  function resize() {
    mainCanvas.width  = fxCanvas.width  = window.innerWidth;
    mainCanvas.height = fxCanvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Load MediaPipe
  loadingMsg.textContent = 'Downloading vision model (~8 MB, first load only)…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/" +
        "hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6,
  });

  // Camera
  loadingMsg.textContent = 'Requesting camera access…';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    });
  } catch {
    loadingMsg.textContent = '❌ Camera access denied — please allow camera and reload.';
    return;
  }
  video.srcObject = stream;
  await new Promise(r => { video.onloadedmetadata = r; });
  await video.play();

  loadingEl.classList.add('hidden');
  setTimeout(() => loadingEl.remove(), 700);

  // Tune particle cap for mobile (keep 60fps)
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const particleCap = isMobile ? 220 : PARTICLE_CAP;

  // State
  let particles   = [];
  let projectiles = [];
  let smoothX = null, smoothY = null, smoothR = 0;
  let prevSX  = null, prevSY  = null;
  let velX = 0, velY = 0;
  let holding     = false;
  let lastTime    = performance.now();
  let lastVidTime = -1;

  // Render loop
  function loop(now) {
    requestAnimationFrame(loop);

    const dt = clamp((now - lastTime) / 1000, 0.001, 0.05);
    lastTime = now;
    const t  = now / 1000;
    const W  = mainCanvas.width;
    const H  = mainCanvas.height;

    let prevHolding = holding;
    let status = 'nohand';

    if (video.readyState >= 2 && video.currentTime !== lastVidTime) {
      lastVidTime = video.currentTime;
      const result = landmarker.detectForVideo(video, now);

      if (result.landmarks && result.landmarks.length > 0) {
        const lm   = result.landmarks[0];
        const fist = isFist(lm);

        if (!fist) {
          const thumb = lm[THUMB_TIP], idx = lm[INDEX_TIP];
          // Mirror X to match the horizontally-flipped video
          const cx = (1 - (thumb.x + idx.x) / 2) * W;
          const cy =      (thumb.y + idx.y) / 2   * H;

          // Use normalised pinch distance (0-1) so sizing is screen-independent
          const pdNorm = Math.hypot(thumb.x - idx.x, thumb.y - idx.y);
          const base   = Math.min(W, H);               // reference dimension
          const minR   = base * 0.04;                   // ~4% of short side
          const maxR   = base * 0.18;                   // ~18% of short side
          // pdNorm range: ~0.03 (pinched) … ~0.25 (fully spread)
          const tR = clamp(
            minR + (pdNorm - 0.03) / (0.25 - 0.03) * (maxR - minR),
            minR, maxR
          );

          smoothX = smoothX === null ? cx : lerp(smoothX, cx, 0.4);
          smoothY = smoothY === null ? cy : lerp(smoothY, cy, 0.4);
          smoothR = smoothR === 0 ? tR : lerp(smoothR, tR, 0.3);

          if (prevSX !== null) {
            velX = (smoothX - prevSX) / dt;
            velY = (smoothY - prevSY) / dt;
          }
          prevSX = smoothX; prevSY = smoothY;
          holding = true;
          status  = 'holding';
        } else {
          holding = false;
          if (prevHolding && prevSX !== null) {
            const speed = Math.hypot(velX, velY);
            if (speed > THROW_SPEED_THRESHOLD) {
              projectiles.push(new Projectile(smoothX, smoothY, velX * THROW_MULT, velY * THROW_MULT, smoothR));
              status = 'thrown';
            } else {
              status = 'snuffed';
            }
          } else {
            status = 'fist';
          }
          prevSX = prevSY = null;
        }
      } else {
        holding = false;
        prevSX = prevSY = null;
      }
    }

    // Draw mirrored video
    mainCtx.save();
    mainCtx.translate(W, 0);
    mainCtx.scale(-1, 1);
    mainCtx.drawImage(video, 0, 0, W, H);
    mainCtx.restore();

    // Clear FX canvas
    fxCtx.clearRect(0, 0, W, H);
    fxCtx.globalCompositeOperation = 'lighter';

    // Emit + draw core
    if (holding && smoothX !== null) {
      for (let i = 0; i < EMIT_RATE; i++) {
        if (particles.length < particleCap) {
          particles.push(new Particle(
            smoothX + (Math.random() - 0.5) * smoothR * 0.6,
            smoothY + (Math.random() - 0.5) * smoothR * 0.6,
            (Math.random() - 0.5) * 40,
            -90 + Math.random() * 60,
            0.3 + Math.random() * 0.3,
            smoothR * 0.5,
          ));
        }
      }
      drawCore(fxCtx, smoothX, smoothY, smoothR);
    }

    // Particles
    particles = particles.filter(p => {
      const alive = p.update(dt, t);
      if (alive) p.draw(fxCtx);
      return alive;
    });

    // Projectiles
    const surviving = [];
    for (const proj of projectiles) {
      proj.update(dt, W, H, particles, particleCap);
      if (proj.alive) { proj.draw(fxCtx); surviving.push(proj); }
      else spawnExplosion(particles, proj.x, proj.y);
    }
    projectiles = surviving;

    // Composite: fire layer with screen blend
    mainCtx.globalCompositeOperation = 'screen';
    mainCtx.drawImage(fxCanvas, 0, 0);

    // Bloom pass
    mainCtx.save();
    mainCtx.globalCompositeOperation = 'screen';
    mainCtx.globalAlpha = 0.4;
    mainCtx.filter = 'blur(14px)';
    mainCtx.drawImage(fxCanvas, 0, 0);
    mainCtx.restore();

    mainCtx.filter = 'none';
    mainCtx.globalCompositeOperation = 'source-over';
    mainCtx.globalAlpha = 1;

    // HUD
    const map = {
      holding: ['🔥 Holding',  'holding'],
      thrown:  ['💥 Thrown!',  'thrown'],
      snuffed: ['💨 Snuffed',  'snuffed'],
      fist:    ['✊ Fist',     ''],
      nohand:  ['👁 No Hand',  ''],
    };
    const [label, cls] = map[status] ?? map.nohand;
    statusEl.textContent = label;
    statusEl.className   = cls;
    pcountEl.textContent = `${particles.length} particles`;
  }

  requestAnimationFrame(loop);
}

main().catch(err => {
  const msg = document.getElementById('loading-msg');
  if (msg) msg.textContent = '❌ ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
